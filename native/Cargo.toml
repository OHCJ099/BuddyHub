[package]
name = "buddyhub-service"
version = "1.0.1"
edition = "2024"

[dependencies]
serde_json = "1"
base64 = "0.23"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
